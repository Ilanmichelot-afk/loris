<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page pour Loris</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #f4f4f9, #e9e9f4);
            color: #333;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px;
        }

        .layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 25px;
            width: 100%;
            max-width: 1200px;
        }

        .side-image {
            width: 180px;
            height: 260px;
            object-fit: cover;
            border-radius: 18px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 3px solid #fff;
        }

        .container {
            max-width: 600px;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            flex: 1;
        }

        h1 {
            color: #d9534f;
            margin-top: 0;
        }

        p {
            font-size: 1.1em;
            line-height: 1.6;
            margin: 12px 0;
        }

        @media (max-width: 820px) {
            .layout {
                flex-direction: column;
            }

            .side-image {
                width: 120px;
                height: 180px;
            }
        }
    </style>
</head>
<body>

    <div class="layout">
        <img class="side-image" src="caca.png" alt="Image gauche">

        <div class="container">
            <!-- Modifie le titre ci-dessous -->
            <h1>Loris</h1>

            <!-- Écris ton texte ci-dessous -->
            <p>
                Tellement tu es con que bah j'ai la flemme d'ecrire voila c tout 
            </p>
            <p>
                stp j'ai pris 1 hure a Cree le site
            </p>
        </div>

        <img class="side-image" src="lapin.png" alt="Image droite">
    </div>

</body>
</html>
